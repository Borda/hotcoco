name: Dependency Audit

# Scheduled security net for time-based RUSTSEC advisories: a new advisory can be
# published against an unchanged dependency, which the push-triggered CI would
# only catch on the next push. This runs daily and, on a finding, opens a single
# deduped tracking issue (auto-closed once the scan is clean again) rather than
# emailing on every run. The job stays green regardless (continue-on-error) so it
# never contributes to the daily email barrage — the issue is the only signal.

on:
  schedule:
    - cron: "0 7 * * *" # daily, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Prebuilt binary, not EmbarkStudios/cargo-deny-action (a Docker action).
      # Beyond the Docker Hub flakiness that broke CI, the Docker form was actively
      # wrong here: a registry timeout made `steps.deny.outcome` = failure, which
      # would have filed a bogus "dependency advisory detected" issue. Installing
      # separately means an infra failure fails this step — which is NOT
      # continue-on-error — so the job goes red instead of crying wolf.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # `cargo-deny` (hyphen) invokes the binary directly rather than through the
      # `cargo` shim: this job installs no toolchain, and going via `cargo` would
      # make rustup download the channel pinned in rust-toolchain.toml for a check
      # that only parses manifests.
      - name: cargo-deny check
        id: deny
        continue-on-error: true
        run: cargo-deny check

      - name: Open tracking issue on new advisory
        if: steps.deny.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const label = "dependency-advisory";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Ensure the label exists.
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: "b60205" });
            }
            // Dedup: only ever keep one open issue for this.
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: label });
            if (open.data.length === 0) {
              await github.rest.issues.create({
                ...context.repo,
                title: "🔒 cargo-deny: dependency advisory detected",
                labels: [label],
                body: [
                  "The daily `cargo-deny` scan found a dependency advisory (or license/ban issue).",
                  "",
                  `Failing run: ${runUrl}`,
                  "",
                  "Reproduce locally with `just audit`, then bump the affected crate or add a",
                  "tracked `ignore` entry in `deny.toml`. This issue auto-closes once the scan is clean.",
                ].join("\n"),
              });
            }

      - name: Close tracking issue when clean
        if: steps.deny.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const label = "dependency-advisory";
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: label });
            for (const issue of open.data) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: "cargo-deny scan is clean again — auto-closing." });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: "closed" });
            }
