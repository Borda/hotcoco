# Mirrors the tools already configured in pyproject.toml and _typos.toml.
# Pins are deliberate: local, pre-commit, and CI must agree on lint results.
# Bump ruff here, in pyproject.toml's [dev] extra, and in ci.yml together.
#
# This repo sets `core.hooksPath = .github/hooks`, so `pre-commit install`
# refuses to run. Use `pre-commit run --all-files`, or call
# `pre-commit run --hook-stage pre-commit` from .github/hooks/pre-commit.
# Rust checks (fmt, clippy, cargo test) stay in that hook — they are not
# duplicated here.

# Vendored and generated files: whitespace fixers must not touch them.
# scripts/fixtures/ holds frozen oracles regenerated by `just gen-fixtures`.
exclude: |
  (?x)^(
    external/|
    data/|
    docs/assets/|
    scripts/fixtures/|
    python/hotcoco/_fonts/|
    python/hotcoco/static/.*\.min\.js$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  # Same two checks as `just py-fmt-check` and `just py-lint`; all settings
  # come from [tool.ruff] in pyproject.toml (line-length 120, py39, E/F/I).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff-check
        files: '^(python|scripts)/'
      - id: ruff-format
        files: '^(python|scripts)/'

  # Config in _typos.toml. Report-only: the default hook args include
  # --write-changes, which would silently rewrite shipped prose (CHANGELOG
  # entries quote British spellings on purpose). Fix the hits by hand.
  - repo: https://github.com/crate-ci/typos
    rev: v1.50.1
    hooks:
      - id: typos
        args: [--force-exclude]
