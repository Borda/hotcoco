<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hotcoco — dataset browser</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥥</text></svg>">
    <style>
    /* Body faces are vendored in python/hotcoco/_fonts and served at /fonts —
       the browser UI must render offline, with no CDN dependency.

       Cyanotype's body face is IBM Plex Sans, which is NOT yet vendored; until
       it is, --font-body falls through to the DM Sans served here. Adding an
       @font-face for Plex before the file exists would 404 on every page load,
       so the rules land with the TTFs. Instrument Serif (display) and IBM Plex
       Mono fall back to the system serif/mono stacks style.css declares. */
    @font-face { font-family: 'DM Sans'; src: url('/fonts/DMSans-Regular.ttf') format('truetype'); font-weight: 300 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'DM Sans'; src: url('/fonts/DMSans-Medium.ttf') format('truetype'); font-weight: 500; font-style: normal; font-display: swap; }
    @font-face { font-family: 'DM Sans'; src: url('/fonts/DMSans-Bold.ttf') format('truetype'); font-weight: 600 700; font-style: normal; font-display: swap; }
    </style>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
</head>
<body>
    {% block body %}{% endblock %}
    <div id="error-toast" class="error-toast"></div>
    <script src="/static/overlay.js"></script>
    <script>
    // Stop shimmer animation once thumbnail images load
    document.addEventListener('load', function(e) {
        if (e.target.tagName === 'IMG' && e.target.closest('.thumb-ratio')) {
            e.target.closest('.thumb-ratio').classList.add('loaded');
        }
    }, true);
    </script>
</body>
</html>
