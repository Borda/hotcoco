# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
# Run: cargo deny check

[advisories]
ignore = [
    # number_prefix is unmaintained but only used transitively via indicatif;
    # no security risk, just missing a new maintainer.
    { id = "RUSTSEC-2025-0119", reason = "transitive dep of indicatif, no security impact" },
    # pyo3 0.28 advisories — fix requires upgrading to pyo3/numpy 0.29, a breaking
    # binding change tracked as its own task. Temporarily ignored to unblock CI.
    # TODO(pyo3-0.29): remove these once the pyo3/numpy 0.29 upgrade lands.
    { id = "RUSTSEC-2026-0176", reason = "pyo3 0.28 OOB read in PyList/PyTuple iterators; deferred to pyo3 0.29 upgrade" },
    { id = "RUSTSEC-2026-0177", reason = "pyo3 0.28 missing Sync bound on PyCFunction::new_closure; deferred to pyo3 0.29 upgrade" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
